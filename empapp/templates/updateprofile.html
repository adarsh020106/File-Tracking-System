{% extends 'empbase.html' %}
{% load static %}
{% block employee %}
<h1>updateProfile</h1>
<div class="row">
    <div class="col-sm-10 mx-auto">
        <div class="card p-4 bg-success text-dark">
            <form class="row" method="post"   enctype="multipart/form-data" g-4>
                {% csrf_token %}
                <div class="col-sm-6">
                    <label for="eid" class="form-label">Employee ID</label>
                    <input type="text" class="form-control" value="{{eid}}" name="empid" id="eid">
                </div>
                <div class="col-sm-6">
                    <label for="empname" class="form-label">Employee Name</label>
                    <input type="text" class="form-control" value="{{emp.name}}" name="name" id="ename">
                </div>
                <div class="col-sm-6">
                    <label for="number" class="form-label">Contact No</label>
                    <input type="number" class="form-control" value="{{emp.contactno}}" name="contactno" id="eno">
                </div>
                <div class="col-sm-6">
                    <label for="em" class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" id="em" value="{{emp.email}}" disabled>
                </div>
                <div class="col-sm-12 mt-3">
                    <label for="pic" >Profile Picture</label>
                    <input type="file" name="picture" class="form-control" id="pic">
                </div>
               <div class="col-sm-12 mt-3">
               <label for="add" class="form-label">Address</label>
                 <textarea name="address"  id="add"  class="form-control">{{emp.address}}</textarea>
               </div>
                <div class="col-sm-12 mt-5">
                    <button type="submit" class="btn btn-info w-100">Update Profile</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
